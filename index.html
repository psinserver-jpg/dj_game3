<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>생존의 숲 - Survival</title>
<link href="https://fonts.googleapis.com/css2?family=Galmuri11&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0f14; font-family: 'Galmuri11', 'Malgun Gothic', sans-serif; color: #f3ead7; user-select: none; }
  canvas { display: block; image-rendering: pixelated; }
  #hud { position: fixed; inset: 0; pointer-events: none; }
  .panel { background: rgba(20, 16, 12, .72); border: 2px solid #5b4630; border-radius: 6px; box-shadow: 0 3px 0 #000a; }
  #stats { position: absolute; left: 16px; top: 16px; padding: 10px 12px; width: 240px; }
  .bar { display: flex; align-items: center; gap: 8px; margin: 4px 0; font-size: 12px; }
  .bar .lbl { width: 40px; }
  .bar .track { flex: 1; height: 12px; background: #2a1f16; border: 1px solid #000; position: relative; }
  .bar .fill { position: absolute; inset: 0; transform-origin: left; transition: transform .15s; }
  #hp .fill { background: linear-gradient(#e0514a, #9c2a25); }
  #hunger .fill { background: linear-gradient(#e7b44a, #a8741d); }
  #clock { position: absolute; right: 16px; top: 16px; padding: 10px 14px; text-align: right; font-size: 13px; line-height: 1.6; }
  #clock b { font-size: 18px; color: #ffd98a; }
  #inv { position: absolute; left: 50%; bottom: 16px; transform: translateX(-50%); display: flex; gap: 6px; padding: 8px; }
  .slot { width: 56px; height: 56px; background: #2a1f16; border: 2px solid #6d5538; border-radius: 4px; position: relative; display: grid; place-items: center; }
  .slot img { width: 40px; height: 40px; object-fit: contain; image-rendering: pixelated; }
  .slot span { position: absolute; right: 3px; bottom: 1px; font-size: 13px; text-shadow: 1px 1px 0 #000; }
  .slot.empty img { opacity: .25; filter: grayscale(1); }
  #help { position: absolute; left: 16px; bottom: 16px; padding: 10px 12px; font-size: 11px; line-height: 1.7; max-width: 260px; }
  #help kbd { background: #5b4630; padding: 0 5px; border-radius: 3px; color: #fff; }
  #toast { position: absolute; top: 90px; left: 50%; transform: translateX(-50%); font-size: 15px; text-shadow: 2px 2px 0 #000; opacity: 0; transition: opacity .3s; white-space: nowrap; }
  .floater { position: absolute; font-size: 14px; font-weight: bold; text-shadow: 1px 1px 0 #000, -1px -1px 0 #000; transform: translate(-50%, -50%); white-space: nowrap; }
  #vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(170, 0, 0, .55)); opacity: 0; transition: opacity .2s; }
  #overlay { position: fixed; inset: 0; display: grid; place-items: center; background: rgba(5, 8, 10, .82); z-index: 10; }
  #overlay .box { text-align: center; padding: 28px 36px; max-width: 520px; }
  #overlay h1 { margin: 0 0 8px; font-size: 34px; color: #ffd98a; text-shadow: 3px 3px 0 #000; }
  #overlay p { font-size: 13px; line-height: 1.8; opacity: .9; }
  #overlay button { pointer-events: auto; margin-top: 14px; font: inherit; font-size: 16px; padding: 10px 28px; background: #8a5a2b; color: #fff; border: 2px solid #3a2410; border-radius: 4px; cursor: pointer; box-shadow: 0 4px 0 #3a2410; }
  #overlay button:hover { background: #a36a33; }
  @media (max-width: 1100px) { #help { bottom: auto; top: 100px; } }
  @media (max-width: 700px) { #help { display: none; } #stats { width: 180px; } .slot { width: 44px; height: 44px; } .slot img { width: 30px; height: 30px; } }
</style>
</head>
<body>
<div id="hud">
  <div id="vignette"></div>
  <div id="stats" class="panel">
    <div class="bar" id="hp"><span class="lbl">체력</span><div class="track"><div class="fill"></div></div></div>
    <div class="bar" id="hunger"><span class="lbl">허기</span><div class="track"><div class="fill"></div></div></div>
  </div>
  <div id="clock" class="panel"><b id="day">1일차</b><br><span id="phase">낮</span></div>
  <div id="inv" class="panel"></div>
  <div id="help" class="panel">
    <kbd>WASD</kbd> 이동 · <kbd>Space</kbd>/클릭 공격·채집<br>
    <kbd>E</kbd> 열매 따기 / 모닥불에 나무 넣기<br>
    <kbd>F</kbd> 먹기 · <kbd>R</kbd> 모닥불에서 고기 굽기<br>
    <kbd>C</kbd> 모닥불 제작 (나무 5 + 돌 3)<br>
    밤에는 추위와 좀비가 찾아옵니다. 불 곁을 지키세요.
  </div>
  <div id="toast"></div>
</div>
<div id="overlay">
  <div class="box panel">
    <h1>생존의 숲</h1>
    <p>나무를 베고 돌을 캐고 멧돼지를 사냥하세요.<br>해가 지면 추위와 함께 좀비가 몰려옵니다.<br>모닥불을 피우고 며칠이나 버틸 수 있는지 도전하세요!</p>
    <button id="start">시작하기</button>
  </div>
</div>
<script src="assets/sprites/sprites.js"></script>
<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
</script>
<script type="module" src="game.js"></script>
</body>
</html>
